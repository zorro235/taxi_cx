<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Такси</title><script src="https://telegram.org/js/telegram-web-app.js?63"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""><style>
:root{--bg:#f5f6f8;--card:#fff;--text:#15171a;--muted:#737780;--accent:#111;--yellow:#ffd43b;--line:#e6e7eb}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.app{max-width:560px;margin:auto;min-height:100vh;padding:16px 14px 28px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px}.brand{font-weight:800;font-size:24px}.iconbtn{border:0;background:#fff;border-radius:14px;width:44px;height:44px;font-size:20px}.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px #0000000a}.role{font-size:27px;font-weight:800;margin:8px 0 6px}.muted{color:var(--muted)}.choice{width:100%;padding:17px;border:0;border-radius:16px;background:#111;color:#fff;font-weight:700;margin-top:10px}.choice.alt{background:var(--yellow);color:#111}.field{padding:14px 15px;border:1px solid var(--line);border-radius:15px;background:#fff;margin-top:9px;cursor:pointer}.field b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.primary{width:100%;border:0;border-radius:16px;background:#111;color:#fff;padding:16px;font-weight:800;margin-top:12px}.secondary{width:100%;border:1px solid var(--line);border-radius:16px;background:#fff;padding:14px;font-weight:700;margin-top:9px}.offer{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.offer:last-child{border-bottom:0}.avatar{width:52px;height:52px;border-radius:50%;background:#eceef2;display:flex;align-items:center;justify-content:center;font-size:23px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.grow{flex:1}.price{font-size:21px;font-weight:800}.stars{color:#f4b400;font-size:14px}.eta{font-size:13px;color:#555}.modal{position:fixed;inset:0;background:#fff;z-index:20;display:none;flex-direction:column}.modal.show{display:flex}.modalhead{padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.map{flex:1}.mapactions{padding:12px;background:#fff}.small{font-size:12px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}.input{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;margin-top:8px}.hidden{display:none}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px;display:flex;justify-content:center}.nav button{border:0;background:none;padding:9px 18px}.demo{font-size:11px;color:#8b8d94}.back{border:0;background:none;font-size:24px}.empty{text-align:center;padding:25px;color:var(--muted)}
</style></head><body><div id="app" class="app"></div><div id="mapModal" class="modal"><div class="modalhead"><button class="back" onclick="closeMap()">‹</button><b id="mapTitle">Выберите точку</b><button class="secondary" style="width:auto;margin:0;padding:8px 12px" onclick="useLocation()">Моя геопозиция</button></div><div id="map" class="map"></div><div class="mapactions"><div id="picked" class="small muted">Нажмите на карте</div><button class="primary" onclick="confirmMap()">Выбрать эту точку</button></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const API=window.location.origin; const KEY='taxi_role_v3'; const UID='tg_'+(tg?.initDataUnsafe?.user?.id || ('guest_'+Math.random().toString(36).slice(2))); let role=localStorage.getItem(KEY)||''; let state={from:null,to:null,ride:null}; let map,pin,mapTarget;
const demoName=tg?.initDataUnsafe?.user?.first_name||'Пользователь';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function api(path,opt={}){let r=await fetch(API+path,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):{}}
function saveRole(r){role=r;localStorage.setItem(KEY,r);api('/api/users',{method:'POST',body:JSON.stringify({id:UID,role:r,name:demoName})}).catch(()=>{});render()}
function render(){if(!role)return roleScreen(); role==='driver'?driverHome():passengerHome()}
function roleScreen(){app.innerHTML=`<div class="top"><div class="brand">🚕 Такси</div></div><div class="card"><div class="role">Добро пожаловать</div><div class="muted">Один раз выберите режим. Потом приложение будет помнить его.</div><button class="choice" onclick="saveRole('passenger')">🚕 Я пассажир</button><button class="choice alt" onclick="saveRole('driver')">👨‍✈️ Я хочу стать водителем</button></div>`}
function passengerHome(){app.innerHTML=`<div class="top"><div class="brand">🚕 Такси</div><button class="iconbtn" onclick="settings()">⚙️</button></div><div class="card"><div class="muted">Маршрут</div><div class="field" onclick="openMap('from')"><b>ОТКУДА</b>${esc(state.from?.text||'Выберите место на карте')}</div><div class="field" onclick="openMap('to')"><b>КУДА</b>${esc(state.to?.text||'Выберите место на карте')}</div><button class="primary" onclick="findDrivers()">ВЫЗВАТЬ ТАКСИ</button></div>${state.ride?`<div class="card"><b>Водители предлагают цену</b><div id="offers">Загрузка...</div></div>`:''}`; if(state.ride)loadOffers()}
async function findDrivers(){if(!state.from||!state.to){alert('Сначала выберите «Откуда» и «Куда» на карте.');return}try{state.ride=await api('/api/rides',{method:'POST',body:JSON.stringify({passenger_id:UID,from_text:state.from.text,from_lat:state.from.lat,from_lon:state.from.lon,to_text:state.to.text,to_lat:state.to.lat,to_lon:state.to.lon})});passengerHome()}catch(e){alert('Не удалось создать заказ: '+e.message)}}
async function loadOffers(){try{let os=await api('/api/rides/'+state.ride.ride_id+'/offers');let el=document.getElementById('offers'); if(!os.length){el.innerHTML='<div class="empty">Пока нет предложений</div>';return} el.innerHTML=os.map(o=>`<div class="offer"><div class="avatar">${o.photo_url?`<img src="${esc(o.photo_url)}">`:'🚕'}</div><div class="grow"><b>${esc(o.name)}</b><div class="stars">★★★★★ <span class="muted">${o.rating} · ${o.reviews_count} отзывов</span></div><div>${esc(o.car_make)} ${esc(o.car_model)}${o.car_year?' · '+o.car_year:''}</div><div class="eta">⏱ Приедет примерно через <b>${o.eta_min} мин</b></div></div><div><div class="price">${o.price} ₽</div><button class="secondary" onclick="selectDriver('${esc(o.driver_id)}')">Выбрать</button></div></div>`).join('')}catch(e){document.getElementById('offers').innerHTML='<div class="empty">Ошибка загрузки предложений</div>'}}
async function selectDriver(id){try{let r=await api('/api/rides/'+state.ride.ride_id+'/select',{method:'POST',body:JSON.stringify({driver_id:id})});app.innerHTML=`<div class="top"><div class="brand">🚕 Такси</div></div><div class="card"><div class="role">Водитель выбран</div><p>Цена поездки: <b>${r.price} ₽</b></p><p class="muted">Ожидайте прибытия водителя.</p><button class="primary" onclick="passengerHome()">На главную</button></div>`}catch(e){alert('Ошибка выбора: '+e.message)}}
function settings(){app.innerHTML=`<div class="top"><button class="back" onclick="passengerHome()">‹</button><div class="brand">Настройки</div></div><div class="card"><b>Режим: пассажир</b><p class="muted">Выбор сохраняется на этом устройстве.</p><button class="secondary" onclick="resetRole()">Сбросить режим</button></div>`}
function resetRole(){if(confirm('Сбросить режим и выбрать заново?')){localStorage.removeItem(KEY);location.reload()}}
function driverHome(){app.innerHTML=`<div class="top"><div class="brand">🚕 Такси</div><button class="iconbtn" onclick="driverSettings()">⚙️</button></div><div class="card"><div class="role">Стать водителем</div><div class="muted">Заполните профиль один раз.</div><input id="dn" class="input" placeholder="Ваше имя"><input id="dp" class="input" placeholder="Телефон"><div class="formrow"><input id="cm" class="input" placeholder="Марка автомобиля *"><input id="cmo" class="input" placeholder="Модель *"></div><div class="formrow"><input id="cy" class="input" placeholder="Год"><input id="pl" class="input" placeholder="Госномер"></div><input id="photo" class="input" placeholder="Ссылка на фото автомобиля (необязательно)"><button class="primary" onclick="registerDriver()">ОТПРАВИТЬ ЗАЯВКУ</button><div class="demo">* Марка и модель обязательны.</div></div>`}
async function registerDriver(){let name=document.getElementById('dn').value.trim(),make=document.getElementById('cm').value.trim(),model=document.getElementById('cmo').value.trim();if(!name||!make||!model){alert('Заполните имя, марку и модель автомобиля.');return}try{await api('/api/drivers',{method:'POST',body:JSON.stringify({id:UID,name,phone:document.getElementById('dp').value,car_make:make,car_model:model,car_year:Number(document.getElementById('cy').value)||null,plate:document.getElementById('pl').value,photo_url:document.getElementById('photo').value})});app.innerHTML=`<div class="top"><div class="brand">🚕 Такси</div></div><div class="card"><div class="role">Заявка принята</div><p>Профиль водителя сохранён.</p><p class="muted">В тестовой версии вы уже видите заказы. В боевой версии здесь будет проверка администратора.</p><button class="primary" onclick="driverOrders()">МОИ ЗАКАЗЫ</button></div>`}catch(e){alert('Ошибка: '+e.message)}}
async function driverOrders(){let ds=await api('/api/drivers/'+UID).catch(()=>null);let rs=await api('/api/rides/driver/'+UID).catch(()=>[]);app.innerHTML=`<div class="top"><button class="back" onclick="driverHome()">‹</button><div class="brand">Мои заказы</div></div><div class="card">${ds?`<b>${esc(ds.name)}</b><div class="stars">★★★★★ ${ds.rating}</div><div>${esc(ds.car_make)} ${esc(ds.car_model)}</div><p>Долг комиссии: <b>${ds.debt} ₽</b></p>`:''}${rs.length?rs.map(r=>`<div class="offer"><div class="grow"><b>Заказ #${r.id}</b><div>${esc(r.from_text)} → ${esc(r.to_text)}</div><div>Цена предложения: ${r.price} ₽ · ⏱ ${r.eta_min} мин</div></div></div>`).join(''):'<div class="empty">Заказов пока нет.</div>'}</div>`}
function driverSettings(){app.innerHTML=`<div class="top"><button class="back" onclick="driverHome()">‹</button><div class="brand">Настройки</div></div><div class="card"><b>Режим: водитель</b><button class="secondary" onclick="resetRole()">Сбросить режим</button></div>`}
function openMap(target){mapTarget=target;document.getElementById('mapTitle').textContent=target==='from'?'Откуда':'Куда';document.getElementById('mapModal').classList.add('show');setTimeout(()=>{if(!map){map=L.map('map').setView([42.2266,43.9678],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);map.on('click',e=>pick(e.latlng.lat,e.latlng.lng))}else map.invalidateSize();if(state[target]){map.setView([state[target].lat,state[target].lon],15);pick(state[target].lat,state[target].lon)}},100)}
function pick(lat,lon){if(pin)pin.remove();pin=L.marker([lat,lon]).addTo(map);window._picked={lat,lon,text:`${lat.toFixed(5)}, ${lon.toFixed(5)}`};document.getElementById('picked').textContent='Выбрано: '+window._picked.text}
function confirmMap(){if(!window._picked){alert('Нажмите на карте или используйте геопозицию.');return}state[mapTarget]={...window._picked};closeMap();passengerHome()}
function closeMap(){document.getElementById('mapModal').classList.remove('show');window._picked=null}
function useLocation(){if(tg?.LocationManager){tg.LocationManager.init(()=>tg.LocationManager.getLocation(loc=>{if(loc) {map.setView([loc.latitude,loc.longitude],16);pick(loc.latitude,loc.longitude)} else alert('Не удалось получить геопозицию. Разрешите доступ к местоположению Telegram.')}))}else if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],16);pick(p.coords.latitude,p.coords.longitude)},()=>alert('Разрешите доступ к геолокации.'))}else alert('Геолокация недоступна.')}
render();
</script></body></html>
