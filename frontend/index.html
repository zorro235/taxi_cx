<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Такси</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{margin:0;background:#f4f4f5;font-family:system-ui;padding:16px}h1{font-size:30px}.card{background:white;border-radius:18px;padding:16px;margin:12px 0}input,textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:12px;margin:6px 0 12px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:13px;background:#111;color:#fff;font-size:16px;font-weight:700}.driver{padding:12px;border:1px solid #ddd;border-radius:14px;margin:8px 0}.stars{font-size:20px;color:#111}</style></head><body><h1>🚕 Такси</h1><div class="card"><label>Откуда</label><input id="from" placeholder="Адрес подачи"><label>Куда</label><input id="to" placeholder="Адрес назначения"><label>Стоимость, ₽ (минимум 100)</label><input id="price" type="number" min="100"><button onclick="order()">Вызвать такси</button></div><div class="card"><b>Водители</b><div id="drivers">Загрузка...</div></div><script>const API="https://YOUR-BACKEND.example.com";const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();async function order(){let p=+price.value;if(!from.value||!to.value||p<100)return alert("Заполните поля; цена от 100 ₽");let u=tg?.initDataUnsafe?.user?.id?.toString()||"demo";let r=await fetch(API+"/api/rides",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({passenger_telegram_id:u,pickup:from.value,destination:to.value,price:p})});let d=await r.json();alert(r.ok?`Заказ создан. Цена ${d.price} ₽`:d.detail||"Ошибка")}async function load(){let r=await fetch(API+"/api/drivers");let a=await r.json();drivers.innerHTML=a.map(d=>`<div class="driver"><b>${d.car_make} ${d.car_model}</b><div class="stars">★ ${d.rating} <small>(${d.rating_count} отзывов)</small></div>${d.car_photo_url?`<img src="${d.car_photo_url}" style="max-width:100%">`:""}</div>`).join("")||"Пока нет водителей"}load();</script></body></html>
