server { listen 80; root /usr/share/nginx/html; index index.html; client_max_body_size 4m; location /api/ { proxy_pass http://backend:8000/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Real-IP $remote_addr; } location /media/ { try_files $uri =404; } location / { try_files $uri $uri/ /index.html; } }
