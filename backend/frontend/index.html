<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Такси</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17202a}main{max-width:900px;margin:auto;padding:14px 14px 32px}.card{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #0001}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.price{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button,input,textarea,select{font:inherit;border-radius:12px;padding:12px;border:1px solid #d7dde3;box-sizing:border-box;width:100%;margin:5px 0}button{background:#1683ff;color:#fff;border:0;font-weight:700}.ghost{background:#eef2f6;color:#17202a}.danger{background:#e5484d}.ok{background:#16a34a}.offer,.rowcard{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #e2e6ea;border-radius:14px;padding:10px;margin:8px 0}.muted,.small{color:#667085;font-size:14px}.big{font-size:28px;font-weight:800}#map{height:360px;border-radius:14px;margin-top:10px}.msg{padding:8px 10px;border-radius:12px;background:#eef2f6;margin:5px 0}.me{background:#dbeafe;text-align:right}.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#ddd}.stat{font-size:24px;font-weight:800}.tabs{display:flex;gap:6px;overflow:auto}.tabs button{white-space:nowrap;width:auto}.route{font-size:13px}.warn{padding:10px;background:#fff4d6;border-radius:12px}</style></head><body><main id="app"></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const S={me:null,order:null,map:null,marker:null,timers:[],geo:null};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,o={}){const h={'X-Telegram-Init-Data':tg?.initData||''};if(o.body&&!(o.body instanceof FormData))h['Content-Type']='application/json';const r=await fetch('/api'+p,{...o,headers:{...h,...(o.headers||{})}});const j=await r.json().catch(()=>({detail:'Ошибка сервера'}));if(!r.ok)throw Error(j.detail||'Ошибка');return j}
function stop(){S.timers.forEach(clearInterval);S.timers=[];if(S.geo)navigator.geolocation.clearWatch(S.geo);S.geo=null}
function render(x){stop();$('app').innerHTML=x}
async function boot(){try{S.me=await api('/me')}catch(e){render(`<div class=card><h2>🚕 Такси</h2><p>${esc(e.message)}</p><p class=muted>Откройте приложение через Telegram.</p></div>`);return}if(S.me.telegram_id && window.__admin) return admin();if(S.me.role==='driver') return driver();if(S.me.role==='passenger') return passenger();roleChoice()}
function roleChoice(){render(`<div class=card><h2>🚕 Такси</h2><p>Выберите режим.</p><button onclick="setRole('passenger')">Я пассажир</button><button onclick="setRole('driver')">Я водитель</button></div>`)}
async function setRole(r){await api('/me/role',{method:'POST',body:JSON.stringify({role:r})});boot()}
function passenger(){render(`<div class=card><div class=row><h2>Новая поездка</h2><button class=ghost style="width:auto" onclick="profile()">Профиль</button></div><input id=pick placeholder="Откуда"><button class=ghost onclick="voice('pick')">🎙️ Голосом</button><input id=dest placeholder="Куда"><button class=ghost onclick="voice('dest')">🎙️ Голосом</button><div id=map></div><p class=muted>Цена задаётся водителем: 100 ₽, 110 ₽, 120 ₽ или своя цена.</p><button onclick="createOrder()">🚕 Найти такси</button><button class=ghost onclick="historyMe()">История поездок</button></div>`);pickMap()}
function pickMap(){const m=L.map('map').setView([42.99,44.15],13);S.map=m;L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);m.on('click',async e=>{const input=!$('pick').value?$('pick'):(!$('dest').value?$('dest'):null);if(!input){alert('Сначала очистите поле «Откуда» или «Куда», чтобы выбрать новую точку.');return}input.value='Определяем адрес…';try{const j=await api('/reverse-geocode?lat='+encodeURIComponent(e.latlng.lat)+'&lng='+encodeURIComponent(e.latlng.lng));input.value=j.address;input.dataset.lat=j.lat;input.dataset.lng=j.lng}catch(err){input.value='';alert('Не удалось определить адрес этой точки. Попробуйте поставить точку рядом с ближайшей улицей или зданием.')}})}
function voice(id){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Голосовой ввод недоступен');const r=new SR();r.lang='ru-RU';r.onresult=e=>{const t=e.results[0][0].transcript;if(confirm('Распознано:\n'+t+'\n\nПодставить?'))$(id).value=t};r.start()}
function coords(s){const m=s.trim().match(/^(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)$/);return m?[+m[1],+m[2]]:null}
async function geo(s){const c=coords(s);if(c)return c;const j=await api('/geocode?q='+encodeURIComponent(s));return [j.lat,j.lng]}
async function createOrder(){try{const pa=$('pick').value.trim(),da=$('dest').value.trim();if(!pa||!da)throw Error('Укажите откуда и куда');const p=($('pick').dataset.lat&&$('pick').dataset.lng)?[Number($('pick').dataset.lat),Number($('pick').dataset.lng)]:await geo(pa),d=($('dest').dataset.lat&&$('dest').dataset.lng)?[Number($('dest').dataset.lat),Number($('dest').dataset.lng)]:await geo(da);const x=await api('/orders',{method:'POST',body:JSON.stringify({pickup_lat:p[0],pickup_lng:p[1],pickup_address:pa,destination_lat:d[0],destination_lng:d[1],destination_address:da})});S.order=x;offers(x.order_id)}catch(e){alert(e.message)}}
function offers(id){render(`<div class=card><h2>Ищем водителей…</h2><p class=muted>Минимум 100 ₽.</p><div id=offers>Загрузка…</div><button class=ghost onclick="cancel(${id})">Отменить</button></div>`);const tick=async()=>{try{const a=await api('/orders/'+id+'/offers');$('offers').innerHTML=a.length?a.map(o=>`<div class=offer><div><b>${o.price} ₽</b><div>${esc(o.name)} · ⭐ ${o.rating} (${o.reviews})</div><div class=muted>${esc((o.car_make||'')+' '+(o.car_model||''))} · ~${o.eta_min} мин</div></div><button style="width:auto" onclick="accept(${o.id})">Выбрать</button></div>`).join(''):'Пока предложений нет…'}catch(e){}};tick();S.timers.push(setInterval(tick,2000))}
async function accept(id){try{const x=await api('/offers/'+id+'/accept',{method:'POST'});S.order=await api('/orders/'+x.order_id).catch(()=>null);trip(x.driver_id,x.price)}catch(e){alert(e.message)}}
async function cancel(id){try{await api('/orders/'+id+'/status',{method:'POST',body:JSON.stringify({status:'CANCELLED'})});passenger()}catch(e){alert(e.message)}}
function dist(a,b,c,d){const R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,q=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
async function trip(driver,price){const o=await api('/orders/mine/active');S.order=o;render(`<div class=card><div class=row><h2>🚕 Водитель едет</h2><b class=big>${price} ₽</b></div><div id=loc class=muted>Получаем GPS…</div><div id=map></div><button onclick="chat(${o.id})">💬 Чат</button><button class=ghost onclick="tripStatus(${o.id},'CANCELLED')">Отменить</button></div>`);const m=L.map('map').setView([o.pickup_lat,o.pickup_lng],14);S.map=m;L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);L.marker([o.pickup_lat,o.pickup_lng]).addTo(m).bindPopup('Вы');const tick=async()=>{try{const x=await api('/drivers/'+driver+'/location');const p=[x.lat,x.lng];if(!S.marker)S.marker=L.marker(p).addTo(m).bindPopup('🚕 Такси');else S.marker.setLatLng(p);$('loc').textContent='До вас '+dist(x.lat,x.lng,o.pickup_lat,o.pickup_lng).toFixed(1)+' км'}catch(e){$('loc').textContent='GPS водителя пока недоступен'}};tick();S.timers.push(setInterval(tick,2000))}
async function tripStatus(id,st){try{await api('/orders/'+id+'/status',{method:'POST',body:JSON.stringify({status:st})});boot()}catch(e){alert(e.message)}}
async function driver(){if(S.me.driver_status!=='APPROVED'){render(`<div class=card><h2>🚕 Водитель</h2><p>Статус заявки: <b>${S.me.driver_status}</b></p><p class=muted>После одобрения разработчиком появится режим «На линии».</p><button class=ghost onclick="profile()">Профиль</button></div>`);return}try{const a=await api('/driver/orders/active');if(a){driverTrip(a);return}}catch(e){}render(`<div class=card><div class=row><h2>🚕 Водитель</h2><button class=ghost style="width:auto" onclick="profile()">Профиль</button></div><button class="${S.me.online?'ok':'ghost'}" onclick="toggleOnline()">${S.me.online?'🟢 На линии':'⚪ Выйти на линию'}</button><div id=fin class=muted>Комиссия…</div><h3>Новые заказы</h3><div id=orders>Загрузка…</div></div>`);loadOrders();finance()}
function driverTrip(o){render(`<div class=card><h2>🚕 Заказ #${o.id}</h2><div><b>Клиент:</b> ${esc(o.passenger_name||'')}</div><div>${esc(o.pickup_address)} → ${esc(o.destination_address)}</div><div class=big>${o.final_price||o.price} ₽</div><button onclick="driverStatus(${o.id},'DRIVER_ARRIVED')" ${o.status!=='DRIVER_ASSIGNED'?'disabled':''}>Я приехал</button><button onclick="driverStatus(${o.id},'TRIP_STARTED')" ${o.status!=='DRIVER_ARRIVED'?'disabled':''}>Поездка началась</button><button onclick="driverStatus(${o.id},'COMPLETED')" ${o.status!=='TRIP_STARTED'?'disabled':''}>Завершить поездку</button><button class=ghost onclick="chat(${o.id})">💬 Чат</button><div class=muted>Статус: ${o.status}</div></div>`);watchGPS()}
async function driverStatus(id,st){try{await api('/orders/'+id+'/status',{method:'POST',body:JSON.stringify({status:st})});driver()}catch(e){alert(e.message)}}
async function toggleOnline(){try{const x=await api('/driver/online',{method:'POST'});S.me.online=x.online;driver();if(x.online)watchGPS()}catch(e){alert(e.message)}}
function watchGPS(){if(!navigator.geolocation)return alert('Геолокация недоступна');S.geo=navigator.geolocation.watchPosition(async p=>{try{await api('/driver/location',{method:'POST',body:JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude,speed:p.coords.speed,course:p.coords.heading,accuracy:p.coords.accuracy})})}catch(e){}},e=>alert('Разрешите геолокацию: '+e.message),{enableHighAccuracy:true,maximumAge:2000,timeout:10000})}
function loadOrders(){const t=async()=>{try{const a=await api('/orders/active');$('orders').innerHTML=a.length?a.map(o=>`<div class=offer><div><b>#${o.id}</b><div>${esc(o.pickup_address)} → ${esc(o.destination_address)}</div></div><button style="width:auto" onclick="offerFor(${o.id})">Цена</button></div>`).join(''):'Нет новых заказов'}catch(e){}};t();S.timers.push(setInterval(t,2500))}
function offerFor(id){render(`<div class=card><h2>Заказ #${id}</h2><p>Выберите цену одним нажатием.</p><div class=price><button onclick="sendOffer(${id},100)">100 ₽</button><button onclick="sendOffer(${id},110)">110 ₽</button><button onclick="sendOffer(${id},120)">120 ₽</button></div><input id=custom type=number min=100 step=10 placeholder="Своя цена, от 100 ₽"><button onclick="sendOffer(${id},Number($('custom').value))">Предложить</button><button class=ghost onclick="driver()">Назад</button></div>`)}
async function sendOffer(id,p){if(!Number.isFinite(p)||p<100)return alert('Минимум 100 ₽');try{await api('/offers',{method:'POST',body:JSON.stringify({order_id:id,price:p,eta_min:10})});driver()}catch(e){alert(e.message)}}
async function finance(){try{const x=await api('/driver/finance');$('fin').innerHTML=`<div><b>Комиссия: ${x.commission_balance.toFixed(2)} ₽</b>${x.blocked?' · 🔒 доступ закрыт':''}</div>${x.commission_balance>0?`<button onclick=commissionPay() style="margin-top:10px">💳 Оплатить через СБП</button>`:`<div class=small>Задолженности нет</div>`}${x.payment?.status==='CREATED'?`<div class=small>Платёж создан. Если вы ещё не оплатили, нажмите кнопку снова.</div>`:''}`}catch(e){$('fin').textContent='Не удалось получить состояние комиссии'}}

async function commissionPay(){try{const x=await api('/driver/finance');if(x.commission_balance<=0)return alert('Комиссии нет');render(`<div class=card><h2>💳 Оплата комиссии</h2><div class=big>${x.commission_balance.toFixed(2)} ₽</div><p>Выберите банк. После выбора приложение откроет банковское приложение с готовым платежом.</p><div id=banklist>Загружаем банки…</div><button class=ghost onclick=driver()>Назад</button></div>`);const r=await api('/driver/commission/banks');const banks=r.banks||[];const normalized=banks.map(b=>({id:b.BankId||b.bankId||b.Id||b.id,name:b.BankName||b.bankName||b.Name||b.name||'Банк'})).filter(b=>b.id);$('banklist').innerHTML=normalized.length?normalized.map(b=>`<button onclick='startCommissionPayment(${JSON.stringify(b.id)},${JSON.stringify(b.name)})'>🏦 ${esc(b.name)}</button>`).join(''):'<div class=muted>Банки не получены. Попробуйте ещё раз.</div>'}catch(e){alert(e.message)}}

async function startCommissionPayment(bankId,bankName){try{const x=await api('/driver/commission/pay',{method:'POST',body:JSON.stringify({bank_id:bankId,bank_name:bankName})});if(x.paid){alert('Комиссии нет');return driver()}if(x.payment_url){location.href=x.payment_url}else alert('Т-Банк не вернул ссылку на оплату')}catch(e){alert(e.message)}}
function profile(){render(`<div class=card><h2>Профиль</h2><input id=pn value="${esc(S.me.name)}" placeholder="Имя (добровольно)"><input id=phone value="${esc(S.me.phone||'')}" placeholder="Телефон (добровольно)"><textarea id=about placeholder="О себе (добровольно)">${esc(S.me.about||'')}</textarea>${S.me.role==='driver'?`<input id=make value="${esc(S.me.car_make||'')}" placeholder="Марка авто"><input id=model value="${esc(S.me.car_model||'')}" placeholder="Модель авто"><input id=plate value="${esc(S.me.car_plate||'')}" placeholder="Госномер">`:''}<input id=photo type=file accept="image/jpeg,image/png,image/webp"><button onclick="saveProfile()">Сохранить</button><button class=ghost onclick="boot()">Назад</button></div>`)}
async function saveProfile(){try{await api('/me/profile',{method:'POST',body:JSON.stringify({name:$('pn').value,phone:$('phone').value||null,about:$('about').value||null,car_make:$('make')?.value||null,car_model:$('model')?.value||null,car_plate:$('plate')?.value||null})});if($('photo').files[0]){const f=new FormData();f.append('file',$('photo').files[0]);await api('/me/photo',{method:'POST',body:f})}S.me=await api('/me');boot()}catch(e){alert(e.message)}}
function chat(id){render(`<div class=card><h2>💬 Чат</h2><div id=msgs></div><input id=msg placeholder="Сообщение"><button onclick="sendMsg(${id})">Отправить</button><button class=ghost onclick="boot()">Назад</button></div>`);const t=async()=>{try{const a=await api('/orders/'+id+'/messages');$('msgs').innerHTML=a.map(m=>`<div class="msg ${m.sender_id===S.me.id?'me':''}">${esc(m.body)}<div class=small>${esc(m.name)}</div></div>`).join('')}catch(e){}};t();S.timers.push(setInterval(t,2000))}
async function sendMsg(id){if(!$('msg').value.trim())return;await api('/orders/'+id+'/messages',{method:'POST',body:JSON.stringify({body:$('msg').value})});$('msg').value=''}
async function historyMe(){try{const a=await api('/orders/mine/history');render(`<div class=card><h2>История поездок</h2>${a.length?a.map(x=>`<div class=rowcard><div><b>#${x.id} · ${x.final_price||'—'} ₽</b><div>${esc(x.pickup_address)} → ${esc(x.destination_address)}</div><div class=small>${esc(x.status)} · ${esc(x.payment_status)}</div></div>${x.status==='COMPLETED'&&x.payment_status!=='PAID'&&x.payment_status!=='CASH'?`<button style="width:auto" onclick="pay(${x.id})">Оплатить</button>`:''}</div>`).join(''):'Пока нет поездок'}<button class=ghost onclick="passenger()">Назад</button></div>`)}catch(e){alert(e.message)}}
async function pay(id){try{const x=await api('/orders/'+id+'/payment',{method:'POST',body:JSON.stringify({method:'ONLINE'})});if(x.invoice_url&&tg?.openInvoice)tg.openInvoice(x.invoice_url,()=>historyMe());else if(x.invoice_url)location.href=x.invoice_url}catch(e){alert(e.message)}}
function admin(){render(`<div class=card><div class=row><h2>🛠 Разработчик</h2><button class=ghost style="width:auto" onclick="boot()">Выйти</button></div><div id=stats class=grid></div><div class=tabs><button onclick="admins('drivers')">Водители</button><button onclick="admins('clients')">Клиенты</button><button onclick="admins('orders')">Заказы</button><button onclick="admins('commission')">Комиссия</button></div><div id=adminlist></div></div>`);adminSummary()}
async function adminSummary(){const x=await api('/admin/summary');$('stats').innerHTML=`<div class=card><div class=stat>${x.drivers_online}</div>На линии</div><div class=card><div class=stat>${x.drivers_total}</div>Водителей</div><div class=card><div class=stat>${x.clients_total}</div>Клиентов</div><div class=card><div class=stat>${x.active_orders}</div>Активных заказов</div><div class=card><div class=stat>${x.completed_trips}</div>Завершено</div><div class=card><div class=stat>${x.completed_amount} ₽</div>Оборот</div>`}
async function admins(kind){try{if(kind==='commission'){const a=await api('/admin/commission');$('adminlist').innerHTML=a.map(x=>`<div class=rowcard><div><b>ID ${x.telegram_id||x.driver_id} · ${esc(x.name)} · ${x.amount} ₽</b><div>${x.period_start} — ${x.period_end} · <b>${x.status}</b></div><div class=small>${esc(x.provider||'—')} · ${esc(x.sbp_bank_name||'банк не указан')} · платёж ${esc(x.provider_payment_id||'—')}</div><div class=small>Создан: ${esc(x.created_at||'—')} · Оплачен: ${esc(x.paid_at||'—')}</div></div></div>`).join('')||'Нет начислений';return}let a=await api('/admin/'+kind);if(kind==='drivers')$('adminlist').innerHTML=a.map(x=>`<div class=rowcard><img class=avatar src="${esc(x.photo_url||'')}" onerror="this.style.visibility='hidden'"><div style="flex:1"><b>${esc(x.name)}</b><div>${esc(x.car_make||'')} ${esc(x.car_model||'')} · ${x.online?'🟢 на линии':'⚪'}</div><div>Поездок: ${x.trips_count} · ⭐ ${x.rating} · комиссия ${x.commission_balance} ₽</div><div class=small>Статус: ${x.driver_status}</div></div><button style="width:auto" onclick="driverTrips(${x.id})">Маршруты</button>${x.driver_status==='PENDING'?`<button style="width:auto" onclick="decision(${x.id},true)">Одобрить</button>`:''}</div>`).join('');else if(kind==='clients')$('adminlist').innerHTML=a.map(x=>`<div class=rowcard><img class=avatar src="${esc(x.photo_url||'')}" onerror="this.style.visibility='hidden'"><div><b>${esc(x.name)}</b><div>${esc(x.username||'')}</div><div>Поездок: ${x.trips_count}</div><div class=small>${esc(x.phone||'')} ${esc(x.about||'')}</div></div></div>`).join('');else $('adminlist').innerHTML=a.map(x=>`<div class=rowcard><div><b>#${x.id} ${esc(x.status)}</b><div>${esc(x.pickup_address)} → ${esc(x.destination_address)}</div><div>${esc(x.passenger_name)} → ${esc(x.driver_name||'—')} · ${x.final_price||'—'} ₽ · ${x.payment_status}</div></div></div>`).join('')}catch(e){alert(e.message)}}
async function decision(id,ok){try{await api('/admin/drivers/'+id+'/decision',{method:'POST',body:JSON.stringify({approved:ok})});admins('drivers')}catch(e){alert(e.message)}}
async function confirmComm(id){try{await api('/admin/commission/'+id+'/confirm',{method:'POST'});admins('commission')}catch(e){alert(e.message)}}
async function driverTrips(id){const a=await api('/admin/drivers/'+id+'/trips');$('adminlist').innerHTML='<h3>Маршруты водителя</h3>'+a.map(x=>`<div class=rowcard><div><b>#${x.order_id} · ${x.final_price} ₽</b><div>${esc(x.pickup_address)} → ${esc(x.destination_address)}</div><div class=route>Координаты: ${x.pickup_lat},${x.pickup_lng} → ${x.destination_lat},${x.destination_lng}</div><div>Клиент: ${esc(x.passenger_name)} · ${x.completed_at}</div></div></div>`).join('')}
window.__admin=new URLSearchParams(location.search).get('developer')==='1';boot();
</script></body></html>
